<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA eSport - Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/logo_HKT.png" alt="EVA eSport Logo">
        </div>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="equipe.html">Équipe</a></li>
                <li><a href="actualites.html">Actualités</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="burger" id="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
        <div class="resaux">
            <a href ="https://www.instagram.com/hkt.esport?igsh=MTgyYmk4MnNlOXBmbQ%3D%3D&utm_source=qr">
                <img src="images/instagram.png" alt="Instagram" >
            </a>
            <a href="https://www.youtube.com/@HKT_EVA">
                <img src="images/youtube.png" alt="YouTube" >
            </a>
        </div>
    </header>
    <main>
        <h1>Contactez-nous</h1>
        <form action="#" method="post">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" required>

            <label for="sujet">Sujet :</label>
            <input type="text" id="sujet" name="sujet" required>

            <label for="message">Message :</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Envoyer</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 EVA eSport. Tous droits réservés.</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
